[package]
name = "gallery"
version = "0.1.0"
edition = "2021"
description = "Minimal photo/video gallery viewer built with GPUI"
license = "MIT"
repository = "https://github.com/yanicells/rustygallery"

[dependencies]
gpui = "0.2.2"
image = "0.25"
kamadak-exif = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.21"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }

[profile.release]
lto = true
codegen-units = 1
